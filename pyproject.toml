[project]
name = "singularity-oop"
version = "0.1.0"
description = "Ядро интернет-магазина: категории и товары"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1"
black = "^24.10"
isort = "^5.13"
mypy = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv|.venv|tests"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
